<section class="row" data-category="{{CATEGORY}}" data-differs="{{DIFFERS}}" data-index="{{INDEX}}">
  <header class="row-header">
    <h2>{{TITLE}}</h2>
    <div class="row-meta">
      <span class="badge cat cat-{{CATEGORY_SLUG}}">{{CATEGORY}}</span>
      {{DIFF_BADGE}}
    </div>
    {{DESCRIPTION_BLOCK}}
  </header>
  <div class="grid">
    <div class="panel {{PANEL_DIFFERS_CLASS}}">
      <div class="panel-head">beautiful-mermaid <em>before</em>
        <span class="dim">{{BEFORE_W}} × {{BEFORE_H}}</span>
      </div>
      <div class="panel-body">{{BEFORE_SVG}}</div>
    </div>
    <div class="panel {{PANEL_DIFFERS_CLASS}}">
      <div class="panel-head">beautiful-mermaid <em>after</em>
        <span class="dim">{{AFTER_W}} × {{AFTER_H}}</span>
      </div>
      <div class="panel-body">{{AFTER_SVG}}</div>
    </div>{{MMC_PANEL}}
  </div>
</section>
