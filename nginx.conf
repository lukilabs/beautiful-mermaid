server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Editor app — exact match so /editor (no trailing slash) works cleanly
    location = /editor {
        try_files /editor.html =404;
    }

    # Static assets — long-lived cache (favicons, images, etc.)
    location ~* \.(ico|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Default — serve index.html for the samples demo
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Content-Type-Options  "nosniff"                         always;
    add_header X-Frame-Options         "SAMEORIGIN"                      always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # Gzip compression for HTML and JS bundles
    gzip              on;
    gzip_vary         on;
    gzip_types        text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;
    gzip_comp_level   6;

    # Send logs to Docker log collector
    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
