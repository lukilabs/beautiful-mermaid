<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" style="--bg:#FFFFFF;--fg:#27272A;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="c4-arrow" viewBox="0 0 8 10" refX="8" refY="5" markerWidth="8" markerHeight="10" orient="auto">
    <path d="M 0 0 L 8 5 L 0 10 Z" fill="var(--_arrow)" />
  </marker>
</defs>
<text x="360" y="24" text-anchor="middle" dy="0.35em" font-size="16" font-weight="700" fill="var(--_text)">Component diagram for API Application</text>
<rect x="30" y="20" width="460" height="320" rx="2" ry="2" fill="none" stroke="var(--_node-stroke)" stroke-width="1" stroke-dasharray="8 4" />
<text x="40" y="36" dy="0.35em" font-size="10" font-weight="400" font-style="italic" fill="var(--_text-muted)">[Container Boundary]</text>
<text x="40" y="50" dy="0.35em" font-size="12" font-weight="600" fill="var(--_text-sec)">API Application</text>
<rect x="60" y="60" width="180" height="90" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="150" y="90" text-anchor="middle" dy="0.35em" font-size="13" font-weight="600" fill="var(--_text)">Auth Controller</text>
<text x="150" y="108" text-anchor="middle" dy="0.35em" font-size="10" font-weight="400" font-style="italic" fill="var(--_text-muted)">[Spring MVC]</text>
<text x="150" y="126" text-anchor="middle" dy="0.35em" font-size="11" font-weight="400" fill="var(--_text-sec)">Handles authentication</text>
<rect x="280" y="60" width="180" height="90" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="370" y="90" text-anchor="middle" dy="0.35em" font-size="13" font-weight="600" fill="var(--_text)">Accounts Controller</text>
<text x="370" y="108" text-anchor="middle" dy="0.35em" font-size="10" font-weight="400" font-style="italic" fill="var(--_text-muted)">[Spring MVC]</text>
<text x="370" y="126" text-anchor="middle" dy="0.35em" font-size="11" font-weight="400" fill="var(--_text-sec)">Provides account information</text>
<rect x="60" y="210" width="180" height="90" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="150" y="240" text-anchor="middle" dy="0.35em" font-size="13" font-weight="600" fill="var(--_text)">Security Component</text>
<text x="150" y="258" text-anchor="middle" dy="0.35em" font-size="10" font-weight="400" font-style="italic" fill="var(--_text-muted)">[Spring Security]</text>
<text x="150" y="276" text-anchor="middle" dy="0.35em" font-size="11" font-weight="400" fill="var(--_text-sec)">Authentication and authorization</text>
<rect x="280" y="210" width="180" height="90" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="370" y="240" text-anchor="middle" dy="0.35em" font-size="13" font-weight="600" fill="var(--_text)">Account Repository</text>
<text x="370" y="258" text-anchor="middle" dy="0.35em" font-size="10" font-weight="400" font-style="italic" fill="var(--_text-muted)">[Spring Data]</text>
<text x="370" y="276" text-anchor="middle" dy="0.35em" font-size="11" font-weight="400" fill="var(--_text-sec)">Accesses account data</text>
<rect x="200" y="390" width="180" height="80" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="290" y="424" text-anchor="middle" dy="0.35em" font-size="13" font-weight="600" fill="var(--_text)">Database</text>
<text x="290" y="442" text-anchor="middle" dy="0.35em" font-size="10" font-weight="400" font-style="italic" fill="var(--_text-muted)">[Oracle 12c]</text>
<polyline points="150,150 150,210" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#c4-arrow)" />
<rect x="130.701" y="171" width="38.598" height="18" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="0.5" />
<text x="150" y="180" text-anchor="middle" dy="0.35em" font-size="11" font-weight="400" fill="var(--_text-muted)">Uses</text>
<polyline points="370,150 370,210" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#c4-arrow)" />
<rect x="350.701" y="171" width="38.598" height="18" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="0.5" />
<text x="370" y="180" text-anchor="middle" dy="0.35em" font-size="11" font-weight="400" fill="var(--_text-muted)">Uses</text>
<polyline points="150,300 250,390" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#c4-arrow)" />
<rect x="148.625" y="331" width="102.75" height="28" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="0.5" />
<text x="200" y="340" text-anchor="middle" dy="0.35em" font-size="11" font-weight="400" fill="var(--_text-muted)">Reads from</text>
<text x="200" y="353" text-anchor="middle" dy="0.35em" font-size="10" font-weight="400" font-style="italic" fill="var(--_text-faint)">[JDBC]</text>
<polyline points="370,300 330,390" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#c4-arrow)" />
<rect x="268.628" y="331" width="162.74400000000003" height="28" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="0.5" />
<text x="350" y="340" text-anchor="middle" dy="0.35em" font-size="11" font-weight="400" fill="var(--_text-muted)">Reads from and writes to</text>
<text x="350" y="353" text-anchor="middle" dy="0.35em" font-size="10" font-weight="400" font-style="italic" fill="var(--_text-faint)">[JDBC]</text>
</svg>