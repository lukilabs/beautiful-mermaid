<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" width="780" height="560" style="--bg:#FFFFFF;--fg:#27272A;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="c4-arrow" viewBox="0 0 8 10" refX="8" refY="5" markerWidth="8" markerHeight="10" orient="auto">
    <path d="M 0 0 L 8 5 L 0 10 Z" fill="var(--_arrow)" />
  </marker>
</defs>
<text x="390" y="24" text-anchor="middle" dy="0.35em" font-size="16" font-weight="700" fill="var(--_text)">Container diagram for Internet Banking System</text>
<rect x="40" y="200" width="710" height="160" rx="2" ry="2" fill="none" stroke="var(--_node-stroke)" stroke-width="1" stroke-dasharray="8 4" />
<text x="50" y="216" dy="0.35em" font-size="10" font-weight="400" font-style="italic" fill="var(--_text-muted)">[System Boundary]</text>
<text x="50" y="230" dy="0.35em" font-size="12" font-weight="600" fill="var(--_text-sec)">Internet Banking</text>
<circle cx="390" cy="38" r="14" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<rect x="310" y="54" width="160" height="96" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="390" y="96" text-anchor="middle" dy="0.35em" font-size="13" font-weight="600" fill="var(--_text)">Customer</text>
<text x="390" y="114" text-anchor="middle" dy="0.35em" font-size="11" font-weight="400" fill="var(--_text-sec)">A banking customer</text>
<rect x="60" y="230" width="190" height="100" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="155" y="265" text-anchor="middle" dy="0.35em" font-size="13" font-weight="600" fill="var(--_text)">Web Application</text>
<text x="155" y="283" text-anchor="middle" dy="0.35em" font-size="10" font-weight="400" font-style="italic" fill="var(--_text-muted)">[Java, Spring MVC]</text>
<text x="155" y="301" text-anchor="middle" dy="0.35em" font-size="11" font-weight="400" fill="var(--_text-sec)">Delivers static content and the single page app</text>
<rect x="300" y="230" width="190" height="100" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="395" y="265" text-anchor="middle" dy="0.35em" font-size="13" font-weight="600" fill="var(--_text)">API Application</text>
<text x="395" y="283" text-anchor="middle" dy="0.35em" font-size="10" font-weight="400" font-style="italic" fill="var(--_text-muted)">[Java, Spring Boot]</text>
<text x="395" y="301" text-anchor="middle" dy="0.35em" font-size="11" font-weight="400" fill="var(--_text-sec)">Provides Internet banking functionality via API</text>
<rect x="540" y="230" width="190" height="100" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="635" y="265" text-anchor="middle" dy="0.35em" font-size="13" font-weight="600" fill="var(--_text)">Database</text>
<text x="635" y="283" text-anchor="middle" dy="0.35em" font-size="10" font-weight="400" font-style="italic" fill="var(--_text-muted)">[Oracle 12c]</text>
<text x="635" y="301" text-anchor="middle" dy="0.35em" font-size="11" font-weight="400" fill="var(--_text-sec)">Stores user registration, authentication, and access logs</text>
<rect x="300" y="430" width="190" height="90" rx="6" ry="6" fill="var(--_text-muted)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="395" y="469" text-anchor="middle" dy="0.35em" font-size="13" font-weight="600" fill="var(--_text)">E-mail System</text>
<text x="395" y="487" text-anchor="middle" dy="0.35em" font-size="11" font-weight="400" fill="var(--_text-sec)">Microsoft Exchange</text>
<polyline points="350,150 155,230" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#c4-arrow)" />
<rect x="211.51999999999998" y="176" width="81.96000000000001" height="28" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="0.5" />
<text x="252.5" y="185" text-anchor="middle" dy="0.35em" font-size="11" font-weight="400" fill="var(--_text-muted)">Uses</text>
<text x="252.5" y="198" text-anchor="middle" dy="0.35em" font-size="10" font-weight="400" font-style="italic" fill="var(--_text-faint)">[HTTPS]</text>
<polyline points="250,280 300,280" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#c4-arrow)" />
<rect x="187.985" y="266" width="174.02999999999997" height="28" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="0.5" />
<text x="275" y="275" text-anchor="middle" dy="0.35em" font-size="11" font-weight="400" fill="var(--_text-muted)">Makes API calls to</text>
<text x="275" y="288" text-anchor="middle" dy="0.35em" font-size="10" font-weight="400" font-style="italic" fill="var(--_text-faint)">[JSON/HTTPS]</text>
<polyline points="490,280 540,280" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#c4-arrow)" />
<rect x="433.628" y="266" width="162.74400000000003" height="28" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="0.5" />
<text x="515" y="275" text-anchor="middle" dy="0.35em" font-size="11" font-weight="400" fill="var(--_text-muted)">Reads from and writes to</text>
<text x="515" y="288" text-anchor="middle" dy="0.35em" font-size="10" font-weight="400" font-style="italic" fill="var(--_text-faint)">[JDBC]</text>
<polyline points="395,330 395,430" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#c4-arrow)" />
<rect x="322.538" y="366" width="144.924" height="28" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="0.5" />
<text x="395" y="375" text-anchor="middle" dy="0.35em" font-size="11" font-weight="400" fill="var(--_text-muted)">Sends e-mails using</text>
<text x="395" y="388" text-anchor="middle" dy="0.35em" font-size="10" font-weight="400" font-style="italic" fill="var(--_text-faint)">[SMTP]</text>
</svg>