<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="500" height="520" style="--bg:#FFFFFF;--fg:#27272A;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
<marker id="archimate-arrow-filled" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="var(--_line)" /></marker>
<marker id="archimate-arrow-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8" fill="none" stroke="var(--_line)" stroke-width="1.25" /></marker>
<marker id="archimate-triangle-open" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="var(--bg)" stroke="var(--_line)" stroke-width="1" /></marker>
<marker id="archimate-diamond-filled" markerWidth="12" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M6,0 L12,4 L6,8 L0,4 Z" fill="var(--_line)" /></marker>
<marker id="archimate-diamond-open" markerWidth="12" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M6,0 L12,4 L6,8 L0,4 Z" fill="var(--bg)" stroke="var(--_line)" stroke-width="1" /></marker>
<marker id="archimate-circle-filled" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse"><circle cx="4" cy="4" r="3" fill="var(--_line)" /></marker>
</defs>
<rect x="20" y="20" width="460" height="140" rx="4" ry="4" fill="color-mix(in srgb, #F0C040 12%, var(--bg))" stroke="color-mix(in srgb, #F0C040 30%, var(--_node-stroke))" stroke-width="1" />
<text x="28" y="36" font-size="11" font-weight="600" fill="var(--_text-muted)">Business</text>
<rect x="20" y="180" width="460" height="140" rx="4" ry="4" fill="color-mix(in srgb, #4488CC 12%, var(--bg))" stroke="color-mix(in srgb, #4488CC 30%, var(--_node-stroke))" stroke-width="1" />
<text x="28" y="196" font-size="11" font-weight="600" fill="var(--_text-muted)">Application</text>
<rect x="20" y="340" width="460" height="140" rx="4" ry="4" fill="color-mix(in srgb, #44AA66 12%, var(--bg))" stroke="color-mix(in srgb, #44AA66 30%, var(--_node-stroke))" stroke-width="1" />
<text x="28" y="356" font-size="11" font-weight="600" fill="var(--_text-muted)">Technology</text>
<polyline points="200,85 280,85" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#archimate-arrow-open)" />
<polyline points="360,110 170,220" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#archimate-arrow-open)" />
<polyline points="170,270 250,380" fill="none" stroke="var(--_line)" stroke-width="1" marker-start="url(#archimate-circle-filled)" marker-end="url(#archimate-arrow-filled)" />
<rect x="60" y="60" width="140" height="50" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="130" y="87" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">Customer</text>
<text x="194" y="72" text-anchor="end" font-size="9" font-weight="400" fill="var(--_text-faint)">Actor</text>
<rect x="280" y="60" width="160" height="50" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="360" y="87" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">Online Banking</text>
<text x="434" y="72" text-anchor="end" font-size="9" font-weight="400" fill="var(--_text-faint)">Service</text>
<rect x="100" y="220" width="140" height="50" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="170" y="247" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">Web App</text>
<text x="234" y="232" text-anchor="end" font-size="9" font-weight="400" fill="var(--_text-faint)">Component</text>
<rect x="300" y="220" width="140" height="50" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="370" y="247" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">Auth Service</text>
<text x="434" y="232" text-anchor="end" font-size="9" font-weight="400" fill="var(--_text-faint)">Service</text>
<rect x="180" y="380" width="140" height="50" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
<text x="250" y="407" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">AWS EC2</text>
<text x="314" y="392" text-anchor="end" font-size="9" font-weight="400" fill="var(--_text-faint)">Node</text>
<rect x="217.949" y="76.5" width="44.102" height="17" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="0.5" />
<text x="240" y="85" text-anchor="middle" dy="0.35em" font-size="11" font-weight="400" fill="var(--_text-muted)">serves</text>
<rect x="235.227" y="156.5" width="59.54600000000001" height="17" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="0.5" />
<text x="265" y="165" text-anchor="middle" dy="0.35em" font-size="11" font-weight="400" fill="var(--_text-muted)">realization</text>
<rect x="178.445" y="316.5" width="63.11000000000001" height="17" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="0.5" />
<text x="210" y="325" text-anchor="middle" dy="0.35em" font-size="11" font-weight="400" fill="var(--_text-muted)">assignment</text>



</svg>